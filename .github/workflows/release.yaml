name: Release Charts

on:
  push:
    branches:
      - main
    paths-ignore:
      - build/**
      - "**/*.md"

jobs:
  lint:
    name: Lint charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint all charts
        run: |
          set -euo pipefail
          for chart in charts/*; do
            [ -d "$chart" ] || continue
            echo "Linting $chart..."
            helm lint "$chart"
          done

  release:
    name: Release changed charts
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          pages_branch: release
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync index.yaml to build/ on release branch
        run: |
          set -euo pipefail
          git fetch origin release

          sync_dir="$(mktemp -d)"
          trap 'git worktree remove "$sync_dir" 2>/dev/null || true' EXIT

          git worktree add --detach "$sync_dir" origin/release
          git -C "$sync_dir" config user.name "github-actions[bot]"
          git -C "$sync_dir" config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p "$sync_dir/build"
          cp "$sync_dir/index.yaml" "$sync_dir/build/index.yaml"
          cp "$sync_dir/README.md" "$sync_dir/build/README.md"

          git -C "$sync_dir" add -A build/
          if git -C "$sync_dir" diff --cached --exit-code; then
            echo "No build changes to commit."
          else
            git -C "$sync_dir" commit -m "Sync Helm index to build/"
            git -C "$sync_dir" push origin HEAD:release
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/build

          # Root
          cp index.yaml site/
          cp README.md site/

          # Legacy /build
          cp index.yaml site/build/
          cp README.md site/build/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
