---
name: Release Charts

on:
  push:
    branches:
      - release
      - main
    paths-ignore:
      - index.yaml
      - build/**
      - .github/workflows/release.yaml

jobs:
  build:
    name: Build charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint and package charts
        run: |
          set -euo pipefail
          mkdir -p build
          for chart in charts/*; do
            [ -d "$chart" ] || continue
            helm lint "$chart"
            helm package "$chart" -d build
          done
          helm repo index build/

      - name: Upload chart packages
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-build
          path: build/

  release:
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          pages_branch: release
          packages_with_index: true
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # IMPORTANT:
      # chart-releaser updates release in a separate worktree and leaves this
      # checkout dirty. Use a clean worktree before committing build/index.yaml.
      - name: Sync build/index.yaml
        run: |
          set -euo pipefail
          git fetch origin release

          sync_dir="$(mktemp -d)"
          trap 'git worktree remove "$sync_dir" 2>/dev/null || true' EXIT

          git worktree add --detach "$sync_dir" origin/release
          git -C "$sync_dir" config user.name "github-actions[bot]"
          git -C "$sync_dir" config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p "$sync_dir/build"
          cp "$sync_dir/index.yaml" "$sync_dir/build/index.yaml"

          git -C "$sync_dir" add build/index.yaml
          if git -C "$sync_dir" diff --cached --exit-code; then
            echo "No changes to commit."
          else
            git -C "$sync_dir" commit -m "Sync Helm index.yaml to build/"
            git -C "$sync_dir" push origin HEAD:release
          fi

  pages:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    needs: release
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve from repo root: index.yaml and build/ are both here
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
